<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien Kohlbecker</title>
  <meta name="description"
    content="Senior infrastructure / CI engineer. ex-GitLab Runner, ex-Datadog. Strasbourg, France.">
  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #5a5a5a;
      --accent: #1a4350;
      --bg: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #7cc5d4;
        --bg: #0a1622;
      }
    }
    html { font-size: 17px; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.55;
      padding: 2rem 1.5rem;
    }
    main { max-width: 38rem; width: 100%; }
    img.avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: block;
      margin: 0 0 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      letter-spacing: -0.01em;
    }
    p { margin: 0 0 1rem; color: var(--muted); }
    p.lead { color: var(--fg); }
    nav {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    a:hover { border-bottom-color: var(--accent); }
  </style>
</head>

<body>
  <main>
    <img class="avatar" src="avatar.jpg" alt="Adrien Kohlbecker" width="72" height="72">
    <h1>Adrien Kohlbecker</h1>
    <p class="lead">Senior infrastructure / CI engineer. ex-GitLab Runner, ex-Datadog. Strasbourg,&nbsp;France.</p>
    <nav>
      <a href="https://github.com/adrienkohlbecker">GitHub</a>
      <a href="https://www.linkedin.com/in/adrienkohlbecker/">LinkedIn</a>
      <a href="mailto:adrien.kohlbecker@gmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
